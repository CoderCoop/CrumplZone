<!DOCTYPE html>

		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #1f2229;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

<script>
window.__cz_prompt = null;
window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); window.__cz_prompt = e; });
window.addEventListener("appinstalled", function () { window.__cz_prompt = null; });
window.__cz_can_install = function () { return !!window.__cz_prompt; };
window.__cz_install = function () { if (window.__cz_prompt) { window.__cz_prompt.prompt(); window.__cz_prompt = null; } };
window.__cz_installed = function () { return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true; };

// Staying current. Godot's service worker is cache-first over the whole app,
// including the game itself, so without this a player keeps the build they
// first loaded. The worker already understands an "update" message — skip
// waiting, claim the page, reload it — but nothing ever sent one.
window.__cz_waiting = null;
window.__cz_update_ready = function () { return !!window.__cz_waiting; };
window.__cz_apply_update = function () {
  if (!window.__cz_waiting) { return false; }
  window.__cz_waiting.postMessage("update");
  window.__cz_waiting = null;
  return true;
};
(function () {
  if (!("serviceWorker" in navigator)) { return; }
  function watch(reg) {
    if (!reg) { return; }
    function offer(worker) {
      if (!worker) { return; }
      // Only an update over something already installed is an update. The
      // very first install has no older build to replace.
      if (worker.state === "installed" && navigator.serviceWorker.controller) {
        window.__cz_waiting = worker;
      }
    }
    offer(reg.waiting);
    reg.addEventListener("updatefound", function () {
      var worker = reg.installing;
      if (!worker) { return; }
      worker.addEventListener("statechange", function () { offer(worker); });
    });
    // Ask often enough that a session started before a release still sees it,
    // and again whenever the app comes back to the foreground — which on a
    // phone is how it is opened at all.
    var check = function () { reg.update().catch(function () {}); };
    setInterval(check, 60000);
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "visible") { check(); }
    });
    check();
  }
  navigator.serviceWorker.getRegistration().then(watch).catch(function () {});
  navigator.serviceWorker.ready.then(watch).catch(function () {});
}());

// Registering the worker at all. Godot only installs it when the browser is
// missing a feature the build needs, and with threads off nothing is missing,
// so no worker was ever registered and the installable app had no offline
// support whatsoever. Measured on the deployed site: no controller at all, and
// every file served under a ten minute max-age.
//
// So register it, which is what makes this an app rather than a bookmark, and
// pair it with the update path above so that cache-first does not turn into
// pinned-to-whatever-you-first-loaded.
window.addEventListener("load", function () {
  if (!("serviceWorker" in navigator)) { return; }
  navigator.serviceWorker.register("index.service.worker.js").then(function () {
    // A page that registers a worker is not controlled by it until the next
    // load, so the first visit would get no offline support and the update
    // machinery would have nothing watching it. The worker takes a "claim"
    // message for exactly this.
    return navigator.serviceWorker.ready;
  }).then(function (reg) {
    if (!navigator.serviceWorker.controller && reg && reg.active) {
      reg.active.postMessage("claim");
    }
  }).catch(function () {});
});
</script>

		<div id="status">

			<progress id="status-progress"></progress>
			<div id="status-notice"></div>

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":315340,"index.wasm":37686550},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"index.service.worker.js"};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
