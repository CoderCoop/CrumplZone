name: pages

on:
  push:
    branches: [main]
    # Rebuilding a 37 MB wasm to publish a README edit helps nobody. Anything
    # that can change what is served is listed; anything else is not.
    paths:
      - 'game/**'
      - 'tools/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.6-stable

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Godot and its export templates
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}"
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x "Godot_v${GODOT_VERSION}_linux.x86_64"
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q templates.tpz
          # Godot looks for templates under a dotted version directory.
          mkdir -p ~/.local/share/godot/export_templates
          mv templates ~/.local/share/godot/export_templates/"${GODOT_VERSION/-/.}"

      - name: Export the web build
        run: |
          godot="./Godot_v${GODOT_VERSION}_linux.x86_64"
          # A fresh checkout has no .godot/ import cache. Exporting without one
          # produces a build missing its resources, so import first.
          "$godot" --headless --path game --import
          mkdir -p build/web
          "$godot" --headless --path game --export-release "Web" ../build/web/index.html
          test -s build/web/index.html
          test -s build/web/index.wasm

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # The build is only useful if it runs on a host that sends no COOP/COEP
      # headers, which is what Pages is. Threads are off in the export preset
      # for that reason; this is what stops that from silently regressing.
      - name: Verify the build runs without cross-origin isolation headers
        run: |
          npm install --no-save --silent playwright
          npx playwright install --with-deps chromium
          tools/verify-web-export.sh

      # And it is only installable if a browser says so. The game has an
      # Install button that only appears when the browser offers one, which
      # means the offer can break in three places — the manifest, the hooks in
      # the page, and the game noticing. This checks all three against a real
      # browser, in a persistent profile, because Chrome refuses to offer an
      # install in incognito and a default automation profile is incognito.
      - name: Verify the build installs as an app
        run: tools/verify-pwa.sh

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verification-screenshots
          path: build/verify
          if-no-files-found: warn

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
