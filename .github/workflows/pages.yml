name: pages

on:
  push:
    branches: [main]
    # Rebuilding a 37 MB wasm to publish a README edit helps nobody. Anything
    # that can change what is served is listed; anything else is not.
    paths:
      - 'game/**'
      - 'tools/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.6-stable

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: godot
        uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
          templates: "true"

      # Export, version.txt, the service-worker patch and the page-script
      # check, in one script shared with preview.yml so a pull request
      # preview is built exactly the way the live site is.
      - name: Export the web build
        run: tools/export-web.sh "${{ steps.godot.outputs.godot }}" build/web

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # The build is only useful if it runs on a host that sends no COOP/COEP
      # headers, which is what Pages is. Threads are off in the export preset
      # for that reason; this is what stops that from silently regressing.
      - name: Verify the build runs without cross-origin isolation headers
        run: |
          npm install --no-save --silent playwright
          npx playwright install --with-deps chromium
          tools/verify-web-export.sh

      # And it is only installable if a browser says so. The game has an
      # Install button that only appears when the browser offers one, which
      # means the offer can break in three places — the manifest, the hooks in
      # the page, and the game noticing. This checks all three against a real
      # browser, in a persistent profile, because Chrome refuses to offer an
      # install in incognito and a default automation profile is incognito.
      - name: Verify the build installs as an app
        run: tools/verify-pwa.sh

      # And an installed app is only worth having if it can be updated. This
      # loads the build, publishes a change over the top of it, and checks a
      # browser that already had the old one ends up on the new one — no cache
      # clearing, no hard refresh, no closing the tab. It runs on a copy of the
      # build, because proving it means rewriting the files being served.
      - name: Verify an update reaches someone who already has it
        run: tools/verify-update.sh

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verification-screenshots
          path: build/verify
          if-no-files-found: warn

      # Every open pull request's preview, under /pr/<number>/. The root of the
      # site is untouched: previews are folded in after every check above has
      # passed on the real build, and version.txt at the root is still the
      # one deploy-drift.yml reads. See preview.yml.
      - name: Add pull request previews
        run: |
          if git fetch --quiet --depth=1 origin previews 2>/dev/null; then
            mkdir -p build/web/pr
            git archive FETCH_HEAD | tar -x -C build/web/pr
            echo "previews folded in: $(ls -d build/web/pr/[0-9]*/ 2>/dev/null | wc -l)"
          else
            echo "no previews branch yet — nothing to fold in"
          fi

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
