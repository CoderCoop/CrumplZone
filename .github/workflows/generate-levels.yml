name: generate-levels

# Measuring how low every level can go is minutes of physics, so it does not
# belong on the pull-request gate and it certainly does not belong in the game.
# It runs here: on demand, and weekly so that a generator change nobody
# re-generated shows up on its own rather than waiting to be noticed.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Measure and report, but do not open a pull request"
        type: boolean
        default: false
  schedule:
    # Mondays, early. Nothing depends on the hour.
    - cron: "17 4 * * 1"

permissions:
  contents: write
  pull-requests: write
  # Lets this workflow ask ci.yml to run on the branch it just pushed. That
  # is the whole mechanism below, and it needs no secret.
  actions: write

env:
  GODOT_VERSION: 4.6-stable

jobs:
  generate:
    runs-on: ubuntu-latest
    # A generate run is minutes. A run that passes half an hour is stuck, and without
    # this the default six-hour limit is what eventually notices — which is
    # exactly what happened when a dispatch loop hung on its first seed.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Measure every level and rewrite the pack
        run: |
          curl -sSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x "Godot_v${GODOT_VERSION}_linux.x86_64"
          godot="$PWD/Godot_v${GODOT_VERSION}_linux.x86_64"
          "$godot" --headless --path game --import >/dev/null 2>&1 || true

          log="$(mktemp)"
          set -o pipefail
          "$godot" --headless --fixed-fps 60 --path game res://generatelevels.tscn 2>&1 | tee "$log"
          if grep -q "SCRIPT ERROR" "$log"; then
            echo "::error::the generate step errored at runtime — the pack it wrote cannot be trusted"
            exit 1
          fi
          # A pack with nothing in it would sail through review as a diff that
          # merely looks small, and would put every level back on the estimate.
          #
          # This guard was wrong in two ways at once and so had never passed,
          # which is why no generate run had opened a pull request and the pack went
          # stale for weeks. grep -E does not read \t as a tab — it reads it
          # as a literal "t" — so the pattern could not match any line; and
          # even with a real tab, the old `[0-9]+: [0-9]` predates the pack
          # storing a dictionary per seed rather than a bare number.
          #
          # It counts and prints now, rather than answering yes or no. A check
          # whose output is a silent success is a check nobody can tell has
          # stopped working, which is exactly what happened here.
          measured=$(grep -cP '^\t[0-9]+: \{"pile"' game/pack.gd || true)
          echo "pack.gd carries $measured measured levels"
          if [ "${measured:-0}" -lt 8 ]; then
            echo "::error::the generate step produced a pack of only ${measured:-0} levels"
            exit 1
          fi
          # Keep the report for the pull request body.
          cp "$log" generate-report.txt

      - name: Show what the measurements would be
        if: inputs.dry_run
        run: |
          echo "::notice::dry run — no pull request will be opened"
          git --no-pager diff --stat -- game/pack.gd

      - name: Keep the measurements for inspection
        if: inputs.dry_run
        uses: actions/upload-artifact@v7
        with:
          name: measured-pack
          path: |
            game/pack.gd
            generate-report.txt

      # main is protected and a bot walking around that gate would make the
      # gate decorative. The generate step proposes; review disposes, and the diff in
      # the pile heights is the thing worth looking at.
      - name: Open a pull request if the measurements moved
        id: pr
        if: ${{ !inputs.dry_run }}
        uses: peter-evans/create-pull-request@v7
        with:
          branch: generated/level-pack
          title: "chore: re-generate the level pack"
          commit-message: |
            chore: re-generate the level pack

            Measured by .github/workflows/generate-levels.yml. Each level is flattened
            several times and the worst pile kept, because the same level does
            not leave the same rubble twice.
          body-path: generate-report.txt
          add-paths: game/pack.gd
          delete-branch: true

      # And ask CI to check it.
      #
      # GitHub does not trigger workflows for events created with
      # GITHUB_TOKEN — deliberately, so a workflow cannot trigger itself
      # forever. A pull request opened above therefore gets no check runs at
      # all, the required `ci` check never reports, and branch protection can
      # never let it merge. That cost three rounds of pushing the same commit
      # to an ordinary branch and opening a second pull request by hand.
      #
      # The rule covers events. It does not cover an explicit dispatch: the
      # REST API will start a workflow run for this token, given
      # `actions: write`. Measured before relying on it — without the
      # permission the call is a 403, with it the run appears and completes,
      # attributed to github-actions[bot].
      #
      # So the real ci.yml runs, against the real branch, and publishes the
      # real check on the commit the pull request is for. Nothing here marks
      # its own homework and no App, deploy key or personal access token is
      # involved.
      - name: Ask CI to check the branch
        if: ${{ !inputs.dry_run && steps.pr.outputs.pull-request-number }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -s -o /tmp/dispatch -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/ci.yml/dispatches" \
            -d '{"ref":"generated/level-pack"}')
          if [ "$code" != "204" ]; then
            echo "::error::could not ask ci.yml to run (HTTP $code)"
            cat /tmp/dispatch
            exit 1
          fi
          echo "::notice::ci.yml dispatched against generated/level-pack; \
          pull request #${{ steps.pr.outputs.pull-request-number }} will \
          gate on it"
