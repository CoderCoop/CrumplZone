name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.18.4
  GODOT_VERSION: 4.6-stable

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan history for secrets
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks detect --source . --redact --no-banner --exit-code 1

      # This check must do real work or say plainly that there is none to do.
      # A green tick that means nothing is worse than no check at all — so
      # every ecosystem this repository does not yet build fails loudly rather
      # than being skipped silently.
      - name: Refuse to skip a build system nobody taught this step about
        run: |
          if   [ -f package.json ];    then echo "::error::package.json found but this step was never taught to build it"; exit 1
          elif [ -f pyproject.toml ];  then echo "::error::pyproject.toml found but this step was never taught to build it"; exit 1
          elif [ -f Cargo.toml ];      then echo "::error::Cargo.toml found but this step was never taught to build it"; exit 1
          elif [ -f go.mod ];          then echo "::error::go.mod found but this step was never taught to build it"; exit 1
          fi

      # The intro screen shows config/version from project.godot. If that and
      # the changelog disagree, the game tells the player one thing and the
      # repository another.
      - name: Version matches the changelog
        run: |
          declared=$(sed -n 's/^config\/version="\(.*\)"$/\1/p' game/project.godot)
          latest=$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md \
            | tr -d '#[] ')
          echo "project.godot : ${declared:-<unset>}"
          echo "CHANGELOG.md  : ${latest:-<none>}"
          if [ -z "$declared" ] || [ -z "$latest" ]; then
            echo "::error::could not read a version from both files"; exit 1
          fi
          if [ "$declared" != "$latest" ]; then
            echo "::error::version mismatch — the intro screen would show $declared"
            exit 1
          fi
          echo "match"

      - name: Check the Godot projects
        run: |
          projects=$(find . -name project.godot -not -path '*/.godot/*' \
            | sed 's|/project.godot$||' | sort)
          if [ -z "$projects" ]; then
            echo "No Godot project and no other build system in this repository."
            echo "::notice::ci passed with nothing to build — secret scan only"
            exit 0
          fi

          curl -sSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x "Godot_v${GODOT_VERSION}_linux.x86_64"
          godot="$PWD/Godot_v${GODOT_VERSION}_linux.x86_64"

          # No export templates here on purpose: importing and type-checking
          # every script catches the errors worth catching at gate speed, and
          # the export itself is exercised by the pages workflow.
          failed=0
          for project in $projects; do
            echo "--- $project ---"
            "$godot" --headless --path "$project" --import >/dev/null
            for script in $(cd "$project" && ls *.gd 2>/dev/null); do
              if "$godot" --headless --path "$project" --check-only --script "$script" 2>&1 \
                  | grep -qE 'SCRIPT ERROR|Parse Error'; then
                echo "::error file=$project/$script::GDScript check failed"
                "$godot" --headless --path "$project" --check-only --script "$script" 2>&1 | head -20
                failed=1
              else
                echo "  ok  $project/$script"
              fi
            done
          done
          if [ "$failed" -ne 0 ]; then exit 1; fi

          # Settled bodies must be woken when a tool changes the world, or
          # everything above a cut block hangs in mid-air. Asserts the
          # mechanism, since the symptom only shows up in a real browser.
          echo "--- wake test ---"
          "$godot" --headless --fixed-fps 60 --path game res://waketest.tscn

          # The hand-built level must stay worth playing: beatable within its
          # move budget, and not beatable in one move. Both are easy to break
          # by retuning a tool, and neither is visible in a diff.
          echo "--- playtest ---"
          "$godot" --headless --fixed-fps 60 --path game res://playtest.tscn

          echo "::notice::ci passed — secret scan, GDScript checks, wake test, playtest"
